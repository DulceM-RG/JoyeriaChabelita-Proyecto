<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Almacén</title>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
        integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">


    <link rel="shortcut icon" href="src/assets/image/chabelitanegro.png" type="image/x-icon">

    <link rel="stylesheet" href="src/css/menuAlmacen.css">
</head>

<body>
    <header class="header">
        <div class="header-image" style="background-image: url('./src/assets/image/header.png');"></div>
    </header>

    <div class="salir-container">
        <button class="btn-salir" onclick="confirmarYcerrar()">
            <img src="src/assets/icon/salir.png" alt="Salir" class="icono-salir">
            Salir
        </button>
    </div>

    <h1 class="titulo-admin">MENÚ DE ALMACÉN</h1>

    <section>

        <article>
            <div class="row row-cols-1 row-cols-md-4 g-4">

                <div class="col">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">
                                <img src="./src/assets/icon/registrarProducto.png" alt="Icono Genérico">
                            </h5>
                            <a href="registrarProducto.html" id="cuadrito" class="btn btn-primary">Registrar Joya</a>
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">
                                <img src="./src/assets/icon/joyas.png" alt="">
                            </h5>
                            <a href="productoVistaAlmacen.html" id="cuadrito" class="btn btn-primary">Ver Joyas</a>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">
                                <img src="./src/assets/icon/agregarProveedor.png" alt="">
                            </h5>
                            <a href="registroProveedor.html" id="cuadrito" class="btn btn-primary">Registrar
                                Proveedor</a>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">
                                <img src="./src/assets/icon/proveedor.png" alt="">
                            </h5>
                            <a href="proveedorVistaAlmacen.html" id="cuadrito" class="btn btn-primary">Ver
                                Proveedores</a>
                        </div>
                    </div>
                </div>
            </div>
    </section>
    </article>




    <footer class="footer">
        <div class="footer-image" style="background-image: url('./src/assets/image/header.png');"></div>
        <div class="footer-bar">
            <div class="footer-content">
                <img src="./src/assets/image/dorado.png" alt="Logo Joyería Chabelita" class="footer-logo">
            </div>
        </div>
    </footer>
    <!-- ========== JAVASCRIPT ========== -->

    <script src="./src/js/cerrarSesion.js"></script>
