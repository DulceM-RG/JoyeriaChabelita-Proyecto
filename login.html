<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Joyería Chabelita</title>
    <!-- Favicon -->
    <link rel="shortcut icon" href="src/assets/image/chabelitanegro.png" type="image/x-icon" />
    <link rel="stylesheet" href="src/css/login.css">
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <!-- Contenido del formulario -->
            <div class="login-content">
                <p class="login-subtitle">Joyería Chabelita</p>

                <form id="loginForm" class="login-form">
                    <!-- ID de Control -->
                    <div class="form-group">
                        <label for="txtIdControl" class="form-label">ID de Control</label>
                        <div class="input-wrapper">
                            <img src="./src/assets/icon/iconUsuario.png" alt="Usuario" class="input-icon">
                            <input type="text" id="txtIdControl" name="idControl" class="form-input"
                                placeholder="Ej: G25102001" pattern="[A-Z]\d{8,9}"
                                title="Formato: Letra mayúscula seguida de 8-9 dígitos" maxlength="10" required
                                autocomplete="username">
                        </div>
                        <small class="form-hint">Formato: Letra + 8-9 dígitos (Ej: G25102001)</small>
                    </div>

                    <!-- Contraseña -->
                    <div class="form-group">
                        <label for="txtContrasena" class="form-label">Contraseña</label>
                        <div class="input-wrapper">
                            <img src="./src/assets/icon/iconCandado.png" alt="Contraseña" class="input-icon">
                            <input type="password" id="txtContrasena" name="contrasena" class="form-input"
                                placeholder="Ingrese su contraseña" required autocomplete="current-password">
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                👁
                            </button>
                        </div>
                    </div>

                    <!-- Botón -->
                    <button type="submit" class="btn-login">Iniciar Sesión</button>


                </form>
            </div>

            <!-- Sección de imagen DENTRO del login-box -->
            <div class="image-section">
                <div class="image-overlay">
                    <img src="src/assets/image/Frame 1.png" alt="Logo Joyería Chabelita" class="logo-overlay">
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('txtContrasena');
            const button = document.querySelector('.toggle-password');
            if (input.type === 'password') {
                input.type = 'text';
                button.textContent = '🙈';
            } else {
                input.type = 'password';
                button.textContent = '👁';
            }
        }

        document.getElementById('txtIdControl').addEventListener('input', function () {
            this.value = this.value.toUpperCase();
        });
    </script>

    <script type="module" src="./src/js/login.js"></script>
</body>

</html>
